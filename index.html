<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya Malavasi</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="home">
    <!-- Dot grid. Fixed to the screen, but its pattern shifts with the pan. -->
    <div id="grid" aria-hidden="true"></div>

    <!-- Drag surface. #world holds everything that pans. -->
    <main id="viewport">
        <div id="world">
            <h1 class="name">Maya Malavasi</h1>
        </div>
    </main>

    <button id="recenter" class="is-hidden" type="button">Recenter</button>

    <script src="js/home.js"></script>
</body>
</html>
