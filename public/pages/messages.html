<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Messages - Maya Malavasi</title>
        <link rel="stylesheet" href="../css/tokens.css" />
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/components.css" />
        <link rel="stylesheet" href="../css/messages.css" />
    </head>
    <body class="admin">
        <!-- The drawer shell, so the button paints with the document.
             js/components/menu.js fills the panel and marks this page. -->
        <nav id="menu" class="menu">
            <button
                id="menu-toggle"
                class="menu-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="menu-panel"
                aria-label="Open menu"
            >
                <span class="menu-bars" aria-hidden="true"></span>
            </button>

            <div id="menu-panel" class="menu-panel"></div>
        </nav>
        <a class="button button-quiet forward-link" href="/pages/edit">Edit images</a>

        <main class="page page-narrow">
            <div class="page-header">
                <h1 class="page-title">Messages</h1>
                <p class="page-count" id="message-count">Loading…</p>
            </div>

            <!-- js/messages.js fills the rows. A click opens the message in
                 the reader under the table. -->
            <table class="inbox">
                <thead>
                    <tr>
                        <th class="inbox-state" scope="col" aria-label="Read state"></th>
                        <th scope="col">From</th>
                        <th scope="col">Subject</th>
                        <th class="inbox-when" scope="col">Received</th>
                    </tr>
                </thead>
                <tbody id="message-rows"></tbody>
            </table>

            <p id="message-status" class="form-status" role="status"></p>

            <section id="message-reader" class="reader" hidden></section>
        </main>

        <script type="module" src="../js/messages.js"></script>
    </body>
</html>
