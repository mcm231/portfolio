<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>About - Maya Malavasi</title>
        <link rel="stylesheet" href="../css/tokens.css" />
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/components.css" />
        <link rel="stylesheet" href="../css/about.css" />
    </head>
    <body class="about">
        <!-- The drawer shell, so the button paints with the document.
             js/components/menu.js fills the panel and marks this page. -->
        <nav id="menu" class="menu">
            <button
                id="menu-toggle"
                class="menu-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="menu-panel"
                aria-label="Open menu"
            >
                <span class="menu-bars" aria-hidden="true"></span>
            </button>

            <div id="menu-panel" class="menu-panel"></div>
        </nav>

        <main class="about-page">
            <!-- Hero: a heading, a short intro, and a portrait. -->
            <header class="hero">
                <div class="hero-text">
                    <p class="eyebrow">[ Eyebrow ]</p>
                    <h1 class="hero-heading">[ Page heading ]</h1>
                    <div class="text-placeholder" data-lines="3" aria-hidden="true"></div>
                    <a class="button" href="/pages/gallery">Gallery Search</a>
                </div>

                <figure class="hero-media">
                    <div class="placeholder placeholder-portrait">Portrait</div>
                    <figcaption class="caption">[ Caption ]</figcaption>
                </figure>
            </header>

            <!-- A two column story section. -->
            <section class="section">
                <p class="section-number">01</p>
                <h2 class="section-heading">[ Section heading ]</h2>
                <div class="columns">
                    <div class="text-placeholder" data-lines="6" aria-hidden="true"></div>
                    <div class="text-placeholder" data-lines="6" aria-hidden="true"></div>
                </div>
            </section>

            <!-- Three images across. -->
            <section class="section">
                <p class="section-number">02</p>
                <h2 class="section-heading">[ Section heading ]</h2>
                <div class="strip">
                    <figure>
                        <div class="placeholder placeholder-wide">Image</div>
                        <figcaption class="caption">[ Caption ]</figcaption>
                    </figure>
                    <figure>
                        <div class="placeholder placeholder-wide">Image</div>
                        <figcaption class="caption">[ Caption ]</figcaption>
                    </figure>
                    <figure>
                        <div class="placeholder placeholder-wide">Image</div>
                        <figcaption class="caption">[ Caption ]</figcaption>
                    </figure>
                </div>
            </section>

            <!-- Three cards: one per practice. -->
            <section class="section">
                <p class="section-number">03</p>
                <h2 class="section-heading">[ Section heading ]</h2>
                <div class="cards">
                    <article class="card-tile">
                        <div class="placeholder placeholder-square">Image</div>
                        <h3 class="card-tile-heading">[ Card heading ]</h3>
                        <div class="text-placeholder" data-lines="3" aria-hidden="true"></div>
                    </article>
                    <article class="card-tile">
                        <div class="placeholder placeholder-square">Image</div>
                        <h3 class="card-tile-heading">[ Card heading ]</h3>
                        <div class="text-placeholder" data-lines="3" aria-hidden="true"></div>
                    </article>
                    <article class="card-tile">
                        <div class="placeholder placeholder-square">Image</div>
                        <h3 class="card-tile-heading">[ Card heading ]</h3>
                        <div class="text-placeholder" data-lines="3" aria-hidden="true"></div>
                    </article>
                </div>
            </section>

            <!-- Closing band, on the brand teal. -->
            <section class="band">
                <h2 class="band-heading">[ Closing heading ]</h2>
                <div
                    class="text-placeholder text-placeholder-invert"
                    data-lines="2"
                    aria-hidden="true"
                ></div>
                <a class="button button-on-brand" href="#">[ Call to action ]</a>
            </section>
        </main>

        <script type="module" src="../js/about.js"></script>
    </body>
</html>
