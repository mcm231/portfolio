<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gallery Search - Maya Malavasi</title>
        <link rel="stylesheet" href="../css/tokens.css" />
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/components.css" />
        <link rel="stylesheet" href="../css/gallery.css" />
    </head>
    <body class="gallery">
        <!-- The drawer shell, so the button paints with the document.
             js/components/menu.js fills the panel and marks this page. -->
        <nav id="menu" class="menu">
            <button
                id="menu-toggle"
                class="menu-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="menu-panel"
                aria-label="Open menu"
            >
                <span class="menu-bars" aria-hidden="true"></span>
            </button>

            <div id="menu-panel" class="menu-panel"></div>
        </nav>

        <div id="app"></div>

        <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script
            crossorigin
            src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
        ></script>

        <!-- React is the one library here, and ARCHITECTURE_GUIDE.md names the
         exception. A module is deferred, so the page script runs after it. -->
        <script type="module" src="../js/gallery.js"></script>
    </body>
</html>
