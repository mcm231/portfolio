<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Search - Maya Malavasi</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="gallery">
    <div id="app"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="../js/gallery.js"></script>

    <!-- A module is deferred, so it runs after the scripts above. The render
         waits inside it, because gallery.js reads window.buildCodeBlock. -->
    <script type="module">
        import { buildCodeBlock } from '/js/code-tile.js';
        import { createLoadingScreen } from '/js/loading-screen.js';
        import { readImages, readParagraphs, previewKey } from '/js/row.js';
        window.buildCodeBlock = buildCodeBlock;
        window.readImages = readImages;
        window.previewKey = previewKey;
        window.readParagraphs = readParagraphs;

        // The cover hides the grid until its first screen of pictures arrives.
        const loader = createLoadingScreen();

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(React.createElement(GalleryPage, { title: 'Gallery Search', loader }));
    </script>
</body>
</html>
