<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Edit - Maya Malavasi</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="gallery">
    <div id="app"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- The same component as the gallery search page. Only the click differs. -->
    <script src="js/gallery.js"></script>
    <script>
        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(React.createElement(GalleryPage, {
            title: 'Edit an image',
            action: { label: 'Upload new', href: '/upload' },
            onSelect: entry => {
                window.location.href = `/upload?id=${encodeURIComponent(entry.id)}`;
            }
        }));
    </script>
</body>
</html>
