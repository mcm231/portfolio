<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Maya Malavasi</title>
        <link rel="stylesheet" href="css/tokens.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/home.css" />

        <!-- The cover waits for js/home.js. With no script there is no photo
             wall either, so the page shows itself instead. -->
        <noscript>
            <style>
                .loading-screen {
                    display: none;
                }
            </style>
        </noscript>
    </head>
    <body class="home">
        <!-- The cover sits in the markup, so it paints with the document and
             no title shows before it. js/components/loading-screen.js fills
             it, and takes it away once the first pictures answer. -->
        <div id="loading-screen" class="loading-screen"></div>

        <!-- Drag surface. Everything inside #plane pans together. -->
        <main id="viewport">
            <div id="plane">
                <div id="mosaic" aria-hidden="true"></div>

                <div id="card" class="card">
                    <h1 class="card-name">Maya Malavasi</h1>
                    <p class="card-tagline">
                        Artist, Engineer, Computer Scientist, Proud Generalist
                    </p>
                    <a class="button" href="/pages/gallery">Gallery Search</a>
                </div>
            </div>
        </main>

        <!-- The drawer shell, so the button paints with the document.
             js/components/menu.js fills the panel and marks this page. -->
        <nav id="menu" class="menu">
            <button
                id="menu-toggle"
                class="menu-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="menu-panel"
                aria-label="Open menu"
            >
                <span class="menu-bars" aria-hidden="true"></span>
            </button>

            <div id="menu-panel" class="menu-panel"></div>
        </nav>

        <div class="view-controls">
            <button
                id="zoom-out"
                class="button button-quiet button-icon"
                type="button"
                aria-label="Zoom out"
            >
                −
            </button>
            <button
                id="zoom-in"
                class="button button-quiet button-icon"
                type="button"
                aria-label="Zoom in"
            >
                +
            </button>
            <button id="recenter" class="button button-quiet is-hidden" type="button">
                Recenter
            </button>
        </div>

        <script type="module" src="js/home.js"></script>
    </body>
</html>
