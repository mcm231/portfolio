<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya Malavasi</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="home">
    <!-- Drag surface. Everything inside #plane pans together. -->
    <main id="viewport">
        <div id="plane">
            <div id="mosaic" aria-hidden="true"></div>

            <div id="card" class="card">
                <h1 class="card-name">Maya Malavasi</h1>
                <a class="button" href="pages/gallery.html">Gallery Search</a>
            </div>
        </div>
    </main>

    <div id="menu-scrim"></div>

    <!-- Standard drawer. The teal rail sits behind the button. -->
    <nav id="menu" class="menu">
        <button id="menu-toggle" class="menu-toggle" type="button"
                aria-expanded="false" aria-controls="menu-panel" aria-label="Open menu">
            <span class="menu-bars" aria-hidden="true"></span>
        </button>

        <div id="menu-panel" class="menu-panel">
            <ul>
                <li><a href="pages/gallery.html">Gallery Search</a></li>
                <li><a href="#">Placeholder One</a></li>
                <li><a href="#">Placeholder Two</a></li>
                <li><a href="#">Placeholder Three</a></li>
                <li><a href="#">Placeholder Four</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
                <!-- Shown only when /api/session says this visitor may upload. -->
                <li class="menu-private" hidden><a href="/upload">Upload</a></li>
                <li class="menu-private" hidden><a href="/edit">Edit</a></li>
            </ul>
        </div>
    </nav>

    <button id="recenter" class="button button-quiet is-hidden" type="button">Recenter</button>

    <script type="module" src="js/home.js"></script>
</body>
</html>
